{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: space-between; gap: 30px; flex-wrap: wrap;">

    <div style="flex: 1; min-width: 300px;">
        <h1 style="font-size: 42px; line-height: 1.2; margin-bottom: 16px;">
            Best Doctor<br>
            Appointment<br>
            Booking
        </h1>

        <p style="font-size: 18px; color: #555; margin-bottom: 24px;">
            Book your doctor appointment online quickly and securely.
        </p>

        {% if not user.is_authenticated %}
            <a href="{% url 'login' %}" class="btn">Login</a>
            <a href="{% url 'signup' %}" class="btn">Sign Up</a>
        {% else %}
            <a href="{% url 'dashboard' %}" class="btn">Go to Dashboard</a>
        {% endif %}
    </div>

    <div style="flex: 1; min-width: 300px; text-align: center;">
        <img src="{% static 'images/doctor.png' %}" alt="Doctor Image" style="max-width: 100%; height: auto;">
    </div>

</div>
{% endblock %}
