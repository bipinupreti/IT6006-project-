{% extends 'base.html' %}

{% block content %}
    <h2>Sign Up</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Sign Up</button>
    </form>

    <p style="margin-top: 15px;">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>
{% endblock %}
