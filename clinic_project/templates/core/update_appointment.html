{% extends 'base.html' %}

{% block content %}
<h2>Update Appointment</h2>

<p><strong>Current Status:</strong> {{ appointment.status }}</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Update Appointment</button>
    <a href="{% url 'patient_dashboard' %}" class="btn">Back</a>
</form>
{% endblock %}
