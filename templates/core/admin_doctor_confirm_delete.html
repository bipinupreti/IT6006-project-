{% extends 'base.html' %}

{% block content %}
<h2>Remove Doctor</h2>

<p>Are you sure you want to remove <strong>{{ doctor_user.username }}</strong> from the system?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, remove doctor</button>
    <a href="{% url 'admin_doctors' %}" class="btn">Cancel</a>
</form>
{% endblock %}
